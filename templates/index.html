<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kowalski Ads Center</title>
    
<script>!function(){var t=localStorage.getItem('rg-theme')||'dark';document.documentElement.setAttribute('data-theme',t)}()</script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a0a0f;
    color: #e4e4e7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}
.landing-card {
    background: #12121a;
    border: 1px solid #1e1e30;
    border-radius: 24px;
    padding: 56px 40px 40px;
    max-width: 400px;
    width: 100%;
    text-align: center;
}
.icon-wrap {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(108,92,231,0.15), rgba(253,121,168,0.1));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    border: 1px solid rgba(108,92,231,0.2);
}
.icon-wrap span { font-size: 36px; }
.landing-card h1 {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #6c5ce7, #fd79a8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
}
.landing-card .sub {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 36px;
    line-height: 1.5;
}
.btn-group { display: flex; flex-direction: column; gap: 10px; }
.btn-landing {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 16px 24px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: all 0.25s;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    letter-spacing: 0.3px;
}
.btn-admin {
    background: linear-gradient(135deg, #6c5ce7, #5a4bd1);
    color: #fff;
    box-shadow: 0 4px 20px rgba(108,92,231,0.25);
}
.btn-admin:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(108,92,231,0.35);
}
.btn-admin:active { transform: translateY(0); }
.btn-guest {
    background: rgba(255,255,255,0.04);
    color: #a1a1aa;
    border: 1px solid #27272a;
}
.btn-guest:hover {
    background: rgba(255,255,255,0.08);
    color: #e4e4e7;
}
.btn-guest:active { transform: translateY(0); }

/* Modal */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 999;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-box {
    background: #12121a;
    border: 1px solid #27272a;
    border-radius: 20px;
    padding: 32px 28px 24px;
    width: 340px;
    max-width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.modal-box .modal-icon {
    font-size: 40px;
    margin-bottom: 12px;
}
.modal-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.modal-box .sub {
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 24px;
}
.modal-box input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid #27272a;
    background: #0a0a0f;
    color: #e4e4e7;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
}
.modal-box input:focus { border-color: #6c5ce7; }
.modal-box input::placeholder { color: #52525b; }
.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}
.modal-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
}
.btn-modal-submit {
    background: #6c5ce7;
    color: #fff;
}
.btn-modal-submit:hover { background: #5a4bd1; }
.btn-modal-submit:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-modal-cancel {
    background: rgba(255,255,255,0.04);
    color: #a1a1aa;
    border: 1px solid #27272a;
}
.btn-modal-cancel:hover { background: rgba(255,255,255,0.08); color: #e4e4e7; }
.modal-error {
    color: #ef4444;
    font-size: 13px;
    margin-top: 12px;
    display: none;
}
.modal-error.show { display: block; }

.footer {
    margin-top: 28px;
    font-size: 11px;
    color: #52525b;
    letter-spacing: 0.5px;
}

@media (max-width: 480px) {
    .landing-card { padding: 40px 24px 32px; }
    .landing-card h1 { font-size: 24px; }
    .btn-landing { font-size: 14px; padding: 14px 20px; }
}
</style>
</head>
<body>
    <div class="landing-card">
        <div class="icon-wrap"><img src="/static/kowalski-logo.png" alt="Kowalskies System" style="width:84px;height:84px;border-radius:18px;object-fit:cover;box-shadow:0 8px 24px rgba(108,92,231,0.35)"></div>
        <h1>Kowalski Ads Center</h1>
        <p class="sub">Meta Ads Dashboard — Kelola &amp; Pantau Iklan Generos</p>

        <div class="btn-group">
            <button class="btn-landing btn-admin" onclick="showAdminModal()">🔐 Login as Admin</button>
            <a href="/dashboard" class="btn-landing btn-guest" onclick="setRole('guest')">👤 Login as Guest</a>
        </div>

        <div class="footer">Generos — Multivitamin Herbal Alami</div>
    </div>

    <!-- Modal Password -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-box">
            <div class="modal-icon">🔐</div>
            <h2>Admin Access</h2>
            <p class="sub">Masukkan password untuk akses penuh</p>
            <input type="password" id="passwordInput" placeholder="Password" onkeydown="if(event.key==='Enter') verifyPassword()" autocomplete="off">
            <div class="modal-error" id="modalError">❌ Password salah</div>
            <div class="modal-actions">
                <button class="btn-modal-cancel" onclick="hideAdminModal()">Batal</button>
                <button class="btn-modal-submit" id="loginBtn" onclick="verifyPassword()">Masuk</button>
            </div>
        </div>
    </div>

<script>
function setRole(role) {
    sessionStorage.setItem('rg_role', role);
}

function showAdminModal() {
    document.getElementById('adminModal').classList.add('show');
    document.getElementById('passwordInput').value = '';
    document.getElementById('modalError').classList.remove('show');
    setTimeout(() => document.getElementById('passwordInput').focus(), 100);
}
function hideAdminModal() {
    document.getElementById('adminModal').classList.remove('show');
}
function verifyPassword() {
    const pwd = document.getElementById('passwordInput').value;
    const btn = document.getElementById('loginBtn');
    if (!pwd) return;
    btn.disabled = true;
    btn.textContent = '⏳';
    document.getElementById('modalError').classList.remove('show');

    fetch('/api/verify-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: pwd})
    })
    .then(r => {
        if (r.ok) return r.json();
        throw new Error('wrong');
    })
    .then(() => {
        setRole('admin');
        window.location.href = '/dashboard';
    })
    .catch(() => {
        document.getElementById('modalError').classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Masuk';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
    });
}

// Kalau session admin masih valid → tombol admin langsung masuk (nggak minta password lagi)
(async function () {
    try {
        const r = await fetch('/api/check-auth', {cache: 'no-store'});
        const j = await r.json();
        if (j && j.admin) {
            const btn = document.querySelector('.btn-admin');
            if (btn) {
                btn.textContent = '➡️ Lanjut sebagai Admin';
                btn.onclick = function () { setRole('admin'); window.location.href = '/dashboard'; };
            }
        }
    } catch (e) {}
})();
</script>


</body>
</html>
